# V1 DEMO IMPLEMENTATION — built for a deadline, not yet understood by
# Miguel. Do not extend without a rebuild pass. See build spec Definition
# of Done.
#
# Render Blueprint: deploys both services from one repo in one step
# (Render dashboard -> New -> Blueprint -> point at this repo).
#
# The two envVars below (ALLOWED_ORIGINS, VITE_API_BASE) assume Render
# grants the exact service names below as subdomains
# (valka-agent-backend.onrender.com / valka-agent-frontend.onrender.com).
# That only fails if those names are already taken by someone else on
# Render, in which case it assigns a random suffix instead -- if so, after
# the first deploy, check the real URLs in the dashboard and update these
# two env vars to match, then trigger a manual redeploy of each service.
# (Render's blueprint cross-service references only expose the private
# network address, not the public URL, so this can't be fully automated.)
services:
  - type: web
    name: valka-agent-backend
    runtime: python
    plan: free
    buildCommand: "curl -LsSf https://astral.sh/uv/install.sh | sh && ~/.local/bin/uv sync"
    # Not "uv run uvicorn ...": the uv binary installed during buildCommand
    # doesn't carry over to the runtime container on Render (only the build
    # OUTPUT does, i.e. the .venv uv sync created) -- confirmed by a failed
    # deploy where startCommand hit "uv: No such file or directory" despite
    # the build succeeding. Calling the venv's uvicorn directly sidesteps
    # needing uv to exist at start time at all.
    startCommand: ".venv/bin/uvicorn valka_agent.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      # Groq is tried first (llm.py -- confirmed live 2026-09-14 at 1000
      # requests/day free, vs. Gemini's gemini-3.6-flash at only 20/day),
      # Gemini is the fallback. At least one of the two is required by
      # config.check_startup_config; set GROQ_API_KEY in the Render
      # dashboard after blueprint creation to get real (non-mock)
      # responses -- GEMINI_API_KEY is also worth setting so the KB's
      # embeddings-based search (RAG) works too (Gemini-only, see kb.py).
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MOCK_LLM
        value: "0"
      - key: ALLOWED_ORIGINS
        value: "https://valka-agent-frontend.onrender.com"

  - type: web
    name: valka-agent-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: "https://valka-agent-backend.onrender.com"
